name: Android
# The Play edition (android/play): build it, check every class the manifest
# names is in the dex, and open it on an emulator to see the game actually
# render. Play rejected vc1 on 3 Nov 2026 because the reviewer got a WebView
# error page instead of the game; a red run here is a build that must not be
# uploaded.
on:
  push:
    paths: ['android/**', 'tools/check-apk.js', 'tools/launch-test.sh', 'tools/tap-through.js', 'index.html', 'sw.js', 'manifest.webmanifest', 'privacy.html', 'fonts/**', 'icons/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tools/check-apk.js', 'tools/launch-test.sh', 'tools/tap-through.js', 'index.html', 'sw.js', 'manifest.webmanifest', 'privacy.html', 'fonts/**', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      # ubuntu-latest ships an SDK under $ANDROID_HOME; use its sdkmanager
      # rather than a setup action (the same approach as Elderon's CI).
      - name: Install the SDK platform and build-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      # The release build, signed with the debug key here (no upload key in
      # CI), so it is the same build Play gets apart from the signature.
      - name: Build the release APK and bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :play:assembleRelease :play:bundleRelease :play:assembleDebug --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the APK would load
        run: node tools/check-apk.js android/play/build/outputs/apk/release/play-release.apk --package com.taugustincst.bubblepop
      - uses: actions/upload-artifact@v4
        with:
          name: play-release-apk
          path: android/play/build/outputs/apk/release/play-release.apk
      # The same code as a debuggable build, for the tap-through test (it
      # reads the page's layout over WebView DevTools, which only a
      # debuggable build exposes).
      - uses: actions/upload-artifact@v4
        with:
          name: play-debug-apk
          path: android/play/build/outputs/apk/debug/play-debug.apk

  launch:
    name: Open it on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: play-release-apk
      # The launch test's error-page pixel check needs ImageMagick, which
      # the runner image no longer ships (it was silently skipped).
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/launch-test.sh play-release.apk com.taugustincst.bubblepop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: launch-test/
          if-no-files-found: ignore

  tap-through:
    name: Tap every button on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: play-debug-apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Play's vc1 review reported unresponsive buttons: this drives every
      # button and screen with real taps and checks each one responds.
      - name: Tap through on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: node tools/tap-through.js play-debug.apk com.taugustincst.bubblepop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-through
          path: tap-through/
          if-no-files-found: ignore
